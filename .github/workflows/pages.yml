name: Deploy Jazz-Men SPA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "data/**"
      - "japan/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("data/artists.json"),
              Path("japan/artists.json"),
              Path("data/playlists.json"),
              Path("data/videos.json"),
          ]
          for path in files:
              with path.open(encoding="utf-8") as f:
                  json.load(f)
              print(f"OK: {path}")

          for path in files[:2]:
              data = json.loads(path.read_text(encoding="utf-8"))
              artists = data.get("artists", [])
              ids = [artist["id"] for artist in artists]
              assert len(ids) == len(set(ids)), f"Duplicate artist IDs in {path}"
              print(f"{path}: {len(artists)} artists")
          PY

      - name: Install pinned JSON Schema validator
        run: python -m pip install jsonschema==4.23.0

      - name: Validate Music Atlas JSON Schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          schema = json.loads(Path("schema/atlas.schema.json").read_text(encoding="utf-8"))
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          mapping = {
              "data/atlas/places.json": "places",
              "data/atlas/eras.json": "eras",
              "data/atlas/concepts.json": "concepts",
              "data/atlas/works.json": "works",
          }
          for filename, key in mapping.items():
              document = json.loads(Path(filename).read_text(encoding="utf-8"))
              validator.validate({key: document})
              print(f"JSON Schema OK: {filename}")
          relation_schema = json.loads(Path("schema/atlas.schema.json").read_text(encoding="utf-8"))
          row_validator = Draft202012Validator(relation_schema["$defs"]["relation"], format_checker=FormatChecker())
          for number, line in enumerate(Path("data/atlas/relations.jsonl").read_text(encoding="utf-8").splitlines(), 1):
              if line.strip():
                  row_validator.validate(json.loads(line))
          print("JSON Schema OK: data/atlas/relations.jsonl")
          PY

      - name: Validate Music Atlas references
        run: python scripts/validate_atlas.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
